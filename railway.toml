# Single image, two roles via SERVICE_ROLE (web default, scheduler).
# No healthcheck gate: the scheduler role serves no HTTP.
# No secrets here; credentials are Railway service variables.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
