# Render blueprint: public web service for the hackathon demo.
#
# Why Render: Meta's model API answers 404 to all requests egressing from
# Railway (both eu-west and us-west, any key, IPv4 and IPv6), while the same
# requests from a laptop or GitHub Actions get normal 401/200 behavior.
# Postgres + the reminder scheduler stay on Railway (neither calls Meta);
# only this web service moves. See docs/DEPLOY_RENDER.md.

services:
  - type: web
    name: yosubi-voice-companion
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: dev
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVICE_ROLE
        value: web
      - key: DATABASE_URL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_ID
        value: muse-spark-1.3
      - key: MODEL_ID_SAFETY
        value: muse-wonder-1.0
      - key: META_BASE_URL
        value: https://api.meta.ai/v1
      - key: META_REASONING_EFFORT
        value: minimal
      - key: DEMO_API_TOKEN
        sync: false
      - key: NEXT_PUBLIC_DEMO_API_TOKEN
        sync: false
      - key: DEMO_RESET_ENABLED
        value: "1"
