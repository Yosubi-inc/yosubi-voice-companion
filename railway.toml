# Railway backend service config (service root = repo root).
# Deploy itself needs owner approval; see docs/DEPLOY.md.
# No secrets here; credentials are Railway service variables.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m app"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
